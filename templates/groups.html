<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Группы | Панель управления</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .sidebar {
            height: 100vh;
            background-color: #212529;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            padding-top: 20px;
        }
        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            display: block;
            padding: 10px 20px;
        }
        .sidebar a:hover, .sidebar a.active {
            color: white;
            background-color: #343a40;
        }
        .content {
            margin-left: 250px;
            padding: 20px;
        }
        .top-bar {
            background-color: white;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card {
            border: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h5 class="px-3 mb-4">Herman Bot Admin</h5>
        <a href="{{ url_for('dashboard') }}"><i class="bi bi-speedometer2 me-2"></i> Панель</a>
        <a href="{{ url_for('users_list') }}"><i class="bi bi-people me-2"></i> Пользователи</a>
        <a href="{{ url_for('groups') }}" class="active"><i class="bi bi-chat-left-text me-2"></i> Группы</a>
        <div class="mt-auto">
            <a href="{{ url_for('logout') }}" class="mt-5"><i class="bi bi-box-arrow-right me-2"></i> Выход</a>
        </div>
    </div>
    
    <div class="content">
        <div class="top-bar">
            <h4>Группы для мониторинга</h4>
            <div>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary btn-sm">Выход</a>
            </div>
        </div>
        
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID группы</th>
                                <th>Дата добавления</th>
                                <th>Ссылка</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for group in groups %}
                            <tr>
                                <td>{{ group.group_id }}</td>
                                <td>{{ group.date_added }}</td>
                                <td>
                                    <a href="https://t.me/c/{{ group.group_id|replace('-100', '') }}" target="_blank" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-box-arrow-up-right"></i> Открыть
                                    </a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                
                {% if not groups %}
                <div class="alert alert-info">
                    Нет добавленных групп для мониторинга
                </div>
                {% endif %}
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
